name: Release assets

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; from pathlib import Path; version=tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; assert os.environ['RELEASE_TAG']=='v'+version, 'release tag/version mismatch'"
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - run: python -m build --no-isolation
      - run: python tools/verify_dist.py
      - name: Render a screenshot from a real failing check and a real passing run
        run: python tools/render_release_screenshot.py dist/proofcli-screenshot.png
      - name: Add the screenshot checksum
        run: python -c "import hashlib; from pathlib import Path; p=Path('dist/proofcli-screenshot.png'); f=Path('dist/SHA256SUMS'); f.write_text(f.read_text()+hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - name: Prepare release notes from the versioned changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/prepare_release.py
      - name: Publish verified distributions and checksums without overwriting releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/proofcli-screenshot.png dist/SHA256SUMS --verify-tag --title "ProofCLI $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
