name: Publish to PyPI

on:
  workflow_run:
    workflows: [Release assets]
    types: [completed]

permissions:
  contents: read

jobs:
  distributions:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Fetch the release distributions and verify commit and checksums
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python tools/fetch_release.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pypi-distributions
          path: packages/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/proofcli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pypi-distributions
          path: packages/
      - name: Publish the verified distributions with a short-lived identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: packages/
