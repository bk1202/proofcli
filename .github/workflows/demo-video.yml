name: Motion demos

on:
  push:
    branches: [main]
    paths: ['demo/**', 'tools/capture_demo.py', 'tools/make_reel_audio.py', 'tools/verify_demo_media.py', '.github/workflows/demo-video.yml']
  pull_request:
    paths: ['demo/**', 'tools/capture_demo.py', 'tools/make_reel_audio.py', 'tools/verify_demo_media.py', '.github/workflows/demo-video.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python tools/capture_demo.py
      - run: git diff --exit-code -- demo/src/evidence.json
      - run: python tools/make_reel_audio.py
      - run: npm ci
        working-directory: demo
      - run: npm audit --audit-level=high
        working-directory: demo
      - run: npm run lint
        working-directory: demo
      - run: npm run reel
        working-directory: demo
      - run: npm run landscape
        working-directory: demo
      - run: npm run reel-cover
        working-directory: demo
      - run: npm run landscape-cover
        working-directory: demo
      - name: Decode both videos and verify dimensions, frames, duration, audio and covers
        run: python tools/verify_demo_media.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: motion-demos-v1
          path: |
            demo/out/proofcli-instagram-reel-v1.mp4
            demo/out/proofcli-landscape-motion-v1.mp4
            demo/out/proofcli-instagram-cover-v1.png
            demo/out/proofcli-landscape-cover-v1.png
            demo/out/proofcli-motion-v1.SHA256SUMS
            demo/out/proofcli-motion-v1-verification.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: motion-demos-v1
          path: motion-demos/
      - name: Add the new cut without replacing published package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.4.1 motion-demos/* --repo "$GITHUB_REPOSITORY"
          gh release view v0.4.1 --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python - <<'PY'
          from pathlib import Path
          p = Path('notes.md')
          body = p.read_text(encoding='utf-8')
          if 'proofcli-instagram-reel-v1.mp4' not in body:
              body += '\n\n### 30-second motion demos\n\n[Vertical / Instagram](https://github.com/bk1202/proofcli/releases/download/v0.4.1/proofcli-instagram-reel-v1.mp4) · [Landscape](https://github.com/bk1202/proofcli/releases/download/v0.4.1/proofcli-landscape-motion-v1.mp4)\n\nBoth use results captured from the actual exporter and ProofCLI. Covers, checksums and media validation are attached separately.\n'
              p.write_text(body, encoding='utf-8')
          PY
          gh release edit v0.4.1 --repo "$GITHUB_REPOSITORY" --notes-file notes.md
