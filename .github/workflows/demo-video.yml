name: Demo video revision

on:
  push:
    branches: [main]
    paths: ['demo/**', 'tools/capture_demo.py', '.github/workflows/demo-video.yml']
  pull_request:
    paths: ['demo/**', 'tools/capture_demo.py', '.github/workflows/demo-video.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  DEMO_FILE: proofcli-demo-v2.mp4

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python tools/capture_demo.py
      - run: git diff --exit-code -- demo/src/evidence.json
      - run: npm ci
        working-directory: demo
      - run: npm audit --audit-level=high
        working-directory: demo
      - run: npm run lint
        working-directory: demo
      - run: npm run render
        working-directory: demo
      - name: Prepare a separately checksummed video revision
        run: |
          python -c "import hashlib,os; from pathlib import Path; p=Path('demo/out/proofcli-demo.mp4'); target=p.with_name(os.environ['DEMO_FILE']); p.rename(target); target.with_suffix('.SHA256SUMS').write_text(hashlib.sha256(target.read_bytes()).hexdigest()+'  '+target.name+'\n')"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: revised-demo
          path: |
            demo/out/proofcli-demo-v2.mp4
            demo/out/proofcli-demo-v2.SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: revised-demo
          path: revised-demo/
      - name: Add the new cut without replacing published package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.4.0 revised-demo/*.mp4 revised-demo/*.SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python -c "from pathlib import Path; p=Path('notes.md'); p.write_text(p.read_text().replace('/v0.4.0/proofcli-demo.mp4','/v0.4.0/proofcli-demo-v2.mp4'))"
          gh release edit v0.4.0 --repo "$GITHUB_REPOSITORY" --notes-file notes.md
