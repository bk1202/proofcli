name: Broken exporter demo

on:
  push:
    branches: [main]
    paths:
      - examples/export/**
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordinary-ci:
    name: Exit-code-only CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Export reports
        run: python examples/export/export.py examples/export/fixtures/input.csv report.json --fault wrong-value
  proofcli:
    name: Check the output with ProofCLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./
        with:
          spec: examples/export/wrong-value.json
