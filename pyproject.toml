[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcli"
version = "0.3.0"
description = "Verify command output contracts instead of trusting exit code zero."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ProofCLI contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/bk1202/proofcli"
Issues = "https://github.com/bk1202/proofcli/issues"

[project.scripts]
proofcli = "proofcli.cli:main"

[tool.setuptools.packages.find]
include = ["proofcli*"]
